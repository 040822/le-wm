version: 1
repository_root: .
output_root: outputs/experiments/fast_lewam_attention_pilots/0820
seed: 3072

attention_implementations:
  block_causal:
    ready: true
    override: stage_b_attention_mode=block_causal
  terminal_full:
    ready: true
    override: stage_b_attention_mode=terminal_full

levels:
  1:
    num_eval: 10
    grounded_slots: 0
  3:
    num_eval: 20
    grounded_slots: 6
  10:
    num_eval: 50
    grounded_slots: 18

promotion:
  success_gain_pp: 5.0
  spearman_gain: 0.05
  regret_reduction_fraction: 0.10

# HDF5 files are deliberately stat-bound by the loader; they are not byte-hashed.
datasets:
  reacher:
    name: dmcontrol/reacher
    path: data/datasets/dmcontrol/reacher.h5
  pusht:
    name: pusht
    path: data/datasets/pusht.h5

identity_files:
  - config/experiments/fast_lewam_attention_pilots.yaml
  - config/train/fast_lewam.yaml
  - config/train/policy/fast_lewam.yaml
  - source/common/eval.py
  - source/common/fast_lewam_validation.py
  - source/policy/fast_lewam.py
  - source/diagnostics/stage_b_epoch_pair_ranking.py
  - source/experiments/fast_lewam_attention_pilots.py
  - scripts/run_fast_lewam_attention_pilots.py
  - scripts/run_fast_lewam_attention_pilot_worker.py
  - eval_fast_lewam.py
  - train.py
  - scripts/diagnose_fast_lewam_epoch_pair_ranking.py
  - scripts/ground_stage_b_episode_failures.py

identity_directories:
  - config/train
  - config/eval
  - source/model/fast_lewam
  - source/common
  - source/policy
  - source/diagnostics

baselines:
  reacher:
    run_dir: outputs/fast_lewam/reacher/0809_e1_stage_b_only_seed3072_tmux
    config: outputs/fast_lewam/reacher/0809_e1_stage_b_only_seed3072_tmux/config.yaml
    checkpoints:
      1: outputs/fast_lewam/reacher/0809_e1_stage_b_only_seed3072_tmux/checkpoints/fast_lewam_weights_epoch_1.pt
      3: outputs/fast_lewam/reacher/0809_e1_stage_b_only_seed3072_tmux/checkpoints/fast_lewam_weights_epoch_3.pt
      10: outputs/fast_lewam/reacher/0809_e1_stage_b_only_seed3072_tmux/checkpoints/fast_lewam_weights_epoch_10.pt
    result: outputs/fast_lewam/reacher/0809_e1_stage_b_only_seed3072_tmux/eval/epoch_10/stage_b/result.json
  pusht:
    run_dir: outputs/fast_lewam/pusht/0802_e1_stage_b_only
    config: outputs/fast_lewam/pusht/0802_e1_stage_b_only/config.yaml
    checkpoints:
      1: outputs/fast_lewam/pusht/0802_e1_stage_b_only/checkpoints/fast_lewam_weights_epoch_1.pt
      3: outputs/fast_lewam/pusht/0802_e1_stage_b_only/checkpoints/fast_lewam_weights_epoch_3.pt
      10: outputs/fast_lewam/pusht/0802_e1_stage_b_only/checkpoints/fast_lewam_weights_epoch_10.pt
    result: outputs/fast_lewam/pusht/0802_e1_stage_b_only/eval/epoch_10/stage_b/result.json

pilots:
  reacher_block_causal:
    gpu: 0
    task: reacher
    attention_variant: block_causal
    baseline: reacher
    output_dir: outputs/experiments/fast_lewam_attention_pilots/0820/reacher_block_causal
    grounding_slots:
      3: [8, 9, 0, 1, 2, 3]
      10: [8, 9, 27, 28, 30, 31, 44, 47, 49, 0, 1, 2, 3, 4, 5, 6, 7, 10]

  pusht_block_causal:
    gpu: 1
    task: pusht
    attention_variant: block_causal
    baseline: pusht
    output_dir: outputs/experiments/fast_lewam_attention_pilots/0820/pusht_block_causal
    grounding_slots:
      3: [1, 4, 11, 16, 0, 2]
      10: [1, 4, 11, 16, 47, 48, 0, 2, 3, 5, 6, 7, 8, 9, 10, 12, 13, 14]

  reacher_terminal_full:
    gpu: 2
    task: reacher
    attention_variant: terminal_full
    baseline: reacher
    output_dir: outputs/experiments/fast_lewam_attention_pilots/0820/reacher_terminal_full
    grounding_slots:
      3: [8, 9, 0, 1, 2, 3]
      10: [8, 9, 27, 28, 30, 31, 44, 47, 49, 0, 1, 2, 3, 4, 5, 6, 7, 10]

  pusht_terminal_full:
    gpu: 3
    task: pusht
    attention_variant: terminal_full
    baseline: pusht
    output_dir: outputs/experiments/fast_lewam_attention_pilots/0820/pusht_terminal_full
    grounding_slots:
      3: [1, 4, 11, 16, 0, 2]
      10: [1, 4, 11, 16, 47, 48, 0, 2, 3, 5, 6, 7, 8, 9, 10, 12, 13, 14]

# Grounding is generated by the existing paired trace/ground diagnostic.
# The worker writes an identity-bound readiness marker before invoking it.
grounding:
  implementation: diagnose_fast_lewam_epoch_pair_ranking
  source: scripts/diagnose_fast_lewam_epoch_pair_ranking.py
  phase: all
  metrics_schema:
    required:
      - predicted_physical_spearman
      - physical_best_regret
