defaults:
  - _self_
  - launcher: local
  - data: pusht
  - policy: fast_lewam

output_model_name: fast_lewam
subdir: null
resume_ckpt: null
num_workers: 8
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
action_horizon: 5
history_size: 1
num_preds: ${action_horizon}
checkpoint_interval_minutes: 30

train_mode: stage_ab
stage_a_goal_injection: token
latent_head_layers: 6
latent_head_dim: 192
latent_action_mix_epochs: 10
detach_clean_action: false
stage_b_timestep_mode: legacy
token_encoding: legacy
stage_b_dynamics: parallel_prefix
stage_b_attention_mode: strict_causal
serial_activation_checkpointing: false
latent_loss_noise_threshold: 0.2
inference_steps: 10

validation_diagnostics:
  enabled: true
  max_batches: 8
  noise_std: 0.1
  seed: ${seed}

epoch_eval:
  # 默认关闭训练时 eval：一次 4-stage epoch eval 需 50-120 分钟，整轮 5 个窗口
  enabled: false
  # null 时自动使用当前 Hydra data 组名（cube/pusht/reacher/tworoom）。
  config_name: null
  stages: [stage_a, stage_a_shuffled_goal, stage_b, stage_c]
  every_n_epochs: 2
  eval_overrides: []

data_pipeline:
  # HDF5Dataset must return channel-first uint8 pixels whose stored spatial
  # resolution already equals img_size; float conversion and normalization
  # then run on the training device after batch transfer.
  gpu_image_preprocessing: true
  hdf5_chunk_size: 100

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  strategy: ddp
  use_distributed_sampler: false

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

loss:
  latent:
    weight: 1.0
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
