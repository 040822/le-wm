defaults:
  - _self_
  - launcher: local
  - data: pusht
  - policy: fast_lewam

output_model_name: fast_lewam
subdir: null

num_workers: 2
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
action_horizon: 5
history_size: 1
num_preds: ${action_horizon}
checkpoint_interval_minutes: 30

train_mode: stage_ab
latent_head_layers: 6
latent_head_dim: 192
latent_action_mix_epochs: 20
detach_clean_action: false
latent_loss_noise_threshold: 0.2
inference_steps: 10

# 默认启用；每 5 个 epoch 由 global rank 0 依次执行轻量 Stage A/B 环境评测。
epoch_eval:
  enabled: true
  # null 时自动使用当前 Hydra data 组名（cube/pusht/reacher/tworoom）。
  config_name: null
  modes: [stage_a, stage_b]
  # 可按需改为 1、10 等正整数，也可通过 Hydra 命令行覆盖。
  every_n_epochs: 5
  num_eval: 5
  seed: 42
  save_video: false
  solver:
    num_samples: 64
    n_steps: 5
    topk: 8

data_pipeline:
  # HDF5Dataset must return channel-first uint8 pixels whose stored spatial
  # resolution already equals img_size; float conversion and normalization
  # then run on the training device after batch transfer.
  gpu_image_preprocessing: true
  hdf5_chunk_size: 100

trainer:
  max_epochs: 100
  devices: 1
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  use_distributed_sampler: false

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 1
  pin_memory: true

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

loss:
  latent:
    weight: 1.0
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
