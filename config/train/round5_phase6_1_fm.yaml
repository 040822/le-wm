defaults:
  - _self_
  - launcher: local
  - data: pusht
  - policy: round4_ab

output_model_name: r5p61_fm_seed3072
subdir: round5/phase6_1/training/fm_b_seed3072
subdir_preserve_path: true
resume_ckpt: null
init_weights: null
initial_epoch: 0
episode_split_manifest: null
num_workers: 8
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
action_horizon: 5
history_size: 1
num_preds: ${action_horizon}
checkpoint_interval_minutes: 30

train_mode: stage_ab_fm
stage_a_goal_injection: token
latent_head_layers: 6
latent_head_dim: 192
latent_action_mix_epochs: 10
detach_clean_action: false
stage_b_action_source: joint
stage_b_timestep_mode: legacy
token_encoding: legacy
stage_b_dynamics: parallel_prefix
stage_b_attention_mode: strict_causal
latent_loss_noise_threshold: 0.2
inference_steps: 16
d_flow_steps: 16
latent_flow_steps: 2
latent_flow_matching: true
activation_checkpointing: true

trainer:
  max_epochs: 10
  devices: 1
  accelerator: gpu
  strategy: auto
  precision: bf16
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  use_distributed_sampler: false

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

loss:
  latent:
    weight: 1.0
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  d:
    lambda: 0.0
  e:
    lambda: 0.0

data_pipeline:
  gpu_image_preprocessing: true
  hdf5_chunk_size: 100

validation_diagnostics:
  enabled: false

epoch_eval:
  enabled: false

round4_diagnostics:
  enabled: true
  output_name: round4_diagnostics.jsonl

round5_phase6_1:
  enabled: true
  effective_batch_size: 128
  latent_flow_diagnostic_steps: 2
  dataset_sha256: null

wandb:
  enabled: false
  config:
    entity: wxflwyr-sun-yat-sen-university
    project: LeWorldModel
    name: ${output_model_name}
    resume: allow
    log_model: false
